name: Trigger Collection

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Collection
        run: |
          echo "Triggering ys-admin Worker at $(date)"
          curl -X POST https://ys-admin.ftsqm.xyz/api/diagnose/trigger-cron \
            || echo "Trigger failed, will retry next schedule"