name: Trigger Collection - Backup Cron

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cron Health & Auto-Recovery
        run: |
          echo "=== Backup Cron Check at $(date -u) ==="
          
          # Step 0: 健康检查
          HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://ys-admin.ftsqm.xyz/api/diagnose/cron \
            -H "User-Agent: GitHub-Actions-Cron" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            --max-time 15 \
            || echo -e "\n000")
          
          HealthHttpCode=$(echo "$HEALTH_RESPONSE" | tail -n1)
          HealthBody=$(echo "$HEALTH_RESPONSE" | sed '$d')
          
          echo "Health HTTP: $HealthHttpCode"
          echo "Health Response: $HealthBody"
          
          NEED_REDEPLOY=false
          NEED_TRIGGER=false
          
          if [ "$HealthHttpCode" != "200" ]; then
            echo "❌ Health check failed (HTTP $HealthHttpCode)"
            NEED_REDEPLOY=true
            NEED_TRIGGER=true
          else
            CRON_HEALTHY=$(echo "$HealthBody" | grep -o '"cronHealthy":[^,}]*' | cut -d':' -f2)
            CRON_TRIGGERED=$(echo "$HealthBody" | grep -o '"cronTriggered":[^,}]*' | cut -d':' -f2)
            SINCE_COLLECT=$(echo "$HealthBody" | grep -o '"sinceLastCollectSeconds":[^,}]*' | cut -d':' -f2)
            HAS_LOCK=$(echo "$HealthBody" | grep -o '"hasLock":[^,}]*' | cut -d':' -f2)
            HOMEPAGE_MODE=$(echo "$HealthBody" | grep -o '"homepageMode":[^,}]*' | cut -d':' -f2)
            HEALTHY_THRESHOLD=$(echo "$HealthBody" | grep -o '"collectHealthyThreshold":[^,}]*' | cut -d':' -f2)
            
            echo "cronHealthy=$CRON_HEALTHY | cronTriggered=$CRON_TRIGGERED | sinceLastCollect=${SINCE_COLLECT}s | hasLock=$HAS_LOCK | homepageMode=$HOMEPAGE_MODE | threshold=${HEALTHY_THRESHOLD}s"
            
            # 场景1：一切正常 → 跳过
            if [ "$CRON_HEALTHY" = "true" ]; then
              echo "✅ Collection healthy (${SINCE_COLLECT}s ago), skipping"
              exit 0
            fi
            
            # 场景2：任务正在运行 → 跳过
            if [ "$HAS_LOCK" = "true" ]; then
              echo "⏳ Collection running, skipping"
              exit 0
            fi
            
            # 场景3：需要恢复
            NEED_TRIGGER=true
            
            # 判断是否需要 redeploy（重启 Worker Isolate）
            if [ "$CRON_TRIGGERED" = "false" ]; then
              echo "⚠️ Cloudflare Cron stopped, need redeploy to restart Isolate"
              NEED_REDEPLOY=true
            elif [ "$CRON_TRIGGERED" = "true" ] && [ "$CRON_HEALTHY" = "false" ]; then
              echo "⚠️ Cron triggered but collection stuck, redeploy needed"
              NEED_REDEPLOY=true
            fi
            
            # 强制重置：超过健康阈值时间未采集则强制重启 Isolate
            FORCE_THRESHOLD=$((${HEALTHY_THRESHOLD:-300} * 3 / 2))
            if [ "$HOMEPAGE_MODE" = "true" ]; then
              FORCE_THRESHOLD=$((${HEALTHY_THRESHOLD:-2100} + 600))
            fi
            if [ -n "$SINCE_COLLECT" ] && [ "$SINCE_COLLECT" -gt "$FORCE_THRESHOLD" ] 2>/dev/null; then
              echo "📌 No collection for >${FORCE_THRESHOLD}s (${SINCE_COLLECT}s), forcing redeploy"
              NEED_REDEPLOY=true
            fi
          fi
          
          # Step 1: 通过 Worker API 重新部署（重启 Worker Isolate）
          if [ "$NEED_REDEPLOY" = "true" ]; then
            echo ""
            echo "=== Step 1: Auto-Redeploy via Worker API ==="
            
            REDEPLOY_SUCCESS=false
            
            # 尝试调用 Worker 的 auto-redeploy 接口（Worker 自己有 CF API Token）
            echo "Calling /api/diagnose/auto-redeploy..."
            REDEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              https://ys-admin.ftsqm.xyz/api/diagnose/auto-redeploy \
              -H "User-Agent: GitHub-Actions-Cron" \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
              --max-time 30 \
              || echo -e "\n000")
            
            RedeployHttpCode=$(echo "$REDEPLOY_RESPONSE" | tail -n1)
            RedeployBody=$(echo "$REDEPLOY_RESPONSE" | sed '$d')
            
            echo "Redeploy HTTP: $RedeployHttpCode"
            echo "Redeploy Response: $RedeployBody"
            
            # 检查 redeploy 是否成功
            REDEPLOY_SUCCESS_VAL=$(echo "$RedeployBody" | grep -o '"success":[^,}]*' | head -1 | cut -d':' -f2)
            COOLDOWN_ACTIVE=$(echo "$RedeployBody" | grep -o '"cooldown":[^,}]*' | cut -d':' -f2)
            
            if [ "$RedeployHttpCode" = "200" ] && [ "$REDEPLOY_SUCCESS_VAL" = "true" ]; then
              echo "✅ Auto-redeploy succeeded! New Isolate will be created."
              REDEPLOY_SUCCESS=true
            elif [ "$COOLDOWN_ACTIVE" = "true" ]; then
              echo "ℹ️ Auto-redeploy cooldown active, Isolate restart already in progress"
              REDEPLOY_SUCCESS=true
            else
              echo "⚠️ Auto-redeploy failed, trying fallback reset..."
              
              # Fallback: 重置状态（不重启 isolate，但清理锁和状态）
              curl -s -X POST https://ys-admin.ftsqm.xyz/api/diagnose/redeploy \
                -H "User-Agent: GitHub-Actions-Cron" \
                -H "Content-Type: application/json" \
                -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
                --max-time 15 > /dev/null 2>&1 || true
              
              echo "✅ Fallback state reset completed"
            fi
            
            # 等待新 Isolate 生效
            echo "Waiting for new Isolate to initialize..."
            sleep 8
          fi
          
          # Step 2: 触发采集任务
          if [ "$NEED_TRIGGER" = "true" ]; then
            echo ""
            echo "=== Step 2: Trigger Collection ==="
            
            TRIGGER_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              https://ys-admin.ftsqm.xyz/api/diagnose/trigger-cron \
              -H "User-Agent: GitHub-Actions-Cron" \
              -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
              --max-time 30 \
              || echo -e "\n000")
            
            TriggerHttpCode=$(echo "$TRIGGER_RESPONSE" | tail -n1)
            TriggerBody=$(echo "$TRIGGER_RESPONSE" | sed '$d')
            
            echo "Trigger HTTP: $TriggerHttpCode"
            echo "Trigger Response: $TriggerBody"
            
            SKIPPED=$(echo "$TriggerBody" | grep -o '"skipped":[^,}]*' | cut -d':' -f2)
            
            if [ "$SKIPPED" = "true" ]; then
              echo "✅ Worker skipped (task recovered or running)"
              exit 0
            fi
            
            if [ "$TriggerHttpCode" = "200" ]; then
              echo "✅ Recovery cycle completed successfully"
              exit 0
            else
              echo "❌ Trigger failed (HTTP $TriggerHttpCode)"
              # 重试一次
              echo "Retrying in 10s..."
              sleep 10
              RETRY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                https://ys-admin.ftsqm.xyz/api/diagnose/trigger-cron \
                -H "User-Agent: GitHub-Actions-Cron" \
                -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
                --max-time 30 \
                || echo -e "\n000")
              RetryHttpCode=$(echo "$RETRY_RESPONSE" | tail -n1)
              if [ "$RetryHttpCode" = "200" ]; then
                echo "✅ Retry succeeded"
                exit 0
              else
                echo "❌ Retry also failed"
                exit 1
              fi
            fi
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ GitHub Actions Cron 执行失败!"
          echo "请检查:"
          echo "1. Worker 是否正常运行: https://ys-admin.ftsqm.xyz/"
          echo "2. GitHub Actions 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
