name: Trigger Collection - Backup Cron

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cron Health & Trigger if Needed
        run: |
          echo "=== Backup Cron Check at $(date -u) ==="
          
          HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://ys-admin.ftsqm.xyz/api/diagnose/cron \
            -H "User-Agent: GitHub-Actions-Cron" \
            || echo -e "\n000")
          
          HealthHttpCode=$(echo "$HEALTH_RESPONSE" | tail -n1)
          HealthBody=$(echo "$HEALTH_RESPONSE" | sed '$d')
          
          echo "Health Check HTTP: $HealthHttpCode"
          echo "Health Response: $HealthBody"
          
          if [ "$HealthHttpCode" != "200" ]; then
            echo "❌ Health check failed, attempting full recovery"
            RESET_NEEDED=true
            ROLLBACK_NEEDED=true
            TRIGGER_AFTER_RESET=true
          else
            CRON_HEALTHY=$(echo "$HealthBody" | grep -o '"cronHealthy":[^,}]*' | cut -d':' -f2)
            CRON_TRIGGERED=$(echo "$HealthBody" | grep -o '"cronTriggered":[^,}]*' | cut -d':' -f2)
            SINCE_COLLECT=$(echo "$HealthBody" | grep -o '"sinceLastCollectSeconds":[^,}]*' | cut -d':' -f2)
            HAS_LOCK=$(echo "$HealthBody" | grep -o '"hasLock":[^,}]*' | cut -d':' -f2)
            
            echo "Cron Healthy (collection executed recently): $CRON_HEALTHY"
            echo "Cron Triggered (cron fired recently): $CRON_TRIGGERED"
            echo "Since Last Collection: ${SINCE_COLLECT}s"
            echo "Has Lock: $HAS_LOCK"
            
            if [ "$CRON_HEALTHY" = "true" ]; then
              echo "✅ Collection executed recently (${SINCE_COLLECT}s ago), skipping backup trigger"
              exit 0
            fi
            
            if [ "$HAS_LOCK" = "true" ]; then
              echo "⏳ Collection task is running, skipping backup trigger"
              exit 0
            fi
            
            RESET_NEEDED=true
            ROLLBACK_NEEDED=false
            TRIGGER_AFTER_RESET=true
            
            if [ "$CRON_TRIGGERED" = "true" ] && [ "$CRON_HEALTHY" = "false" ]; then
              echo "⚠️ Cron triggered but collection stuck, will reset + rollback + re-trigger"
              ROLLBACK_NEEDED=true
            elif [ "$CRON_TRIGGERED" = "false" ]; then
              echo "⚠️ Cloudflare Cron appears stopped, will reset + rollback + re-trigger"
              ROLLBACK_NEEDED=true
              # 每小时强制一次 rollback（重置运行时状态）
              if [ -n "$SINCE_COLLECT" ] && [ "$SINCE_COLLECT" -gt 3600 ] 2>/dev/null; then
                echo "📌 Last collection was ${SINCE_COLLECT}s ago (>1h), forcing runtime reset"
                FORCE_ROLLBACK=true
              fi
            fi
          fi
          
          if [ "$RESET_NEEDED" = "true" ]; then
            echo "--- Step 1: Resetting KV State ---"
            RESET_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              https://ys-admin.ftsqm.xyz/api/diagnose/reset-cron \
              -H "User-Agent: GitHub-Actions-Cron" \
              || echo -e "\n000")
            
            ResetHttpCode=$(echo "$RESET_RESPONSE" | tail -n1)
            ResetBody=$(echo "$RESET_RESPONSE" | sed '$d')
            
            echo "Reset HTTP: $ResetHttpCode"
            echo "Reset Response: $ResetBody"
            
            DELETED_COUNT=$(echo "$ResetBody" | grep -o '"deletedCount":[^,}]*' | cut -d':' -f2)
            echo "✅ KV Reset completed: ${DELETED_COUNT:-unknown} keys deleted"
          fi
          
          if [ "$ROLLBACK_NEEDED" = "true" ]; then
            echo "--- Step 2: Rolling Back Worker Runtime ---"
            
            VERSION_RESPONSE=$(curl -s https://ys-admin.ftsqm.xyz/api/diagnose/version \
              -H "User-Agent: GitHub-Actions-Cron" \
              || echo '{"versionId":"unknown"}')
            
            CURRENT_VERSION=$(echo "$VERSION_RESPONSE" | grep -o '"versionId":"[^"]*"' | cut -d'"' -f4)
            echo "Current Worker Version: $CURRENT_VERSION"
            
            if [ "$CURRENT_VERSION" != "unknown" ] && [ -n "${CLOUDFIRE_API_TOKEN}" ]; then
              echo "Executing wrangler rollback to version $CURRENT_VERSION..."
              
              npx wrangler rollback "$CURRENT_VERSION" 2>&1 || {
                echo "⚠️ wrangler rollback failed, trying alternative deploy..."
                cd /tmp && git clone --depth 1 https://github.com/hackv/YS.git worker-repo 2>/dev/null || true
                if [ -d "/tmp/worker-repo/ys-admin/cf-worker" ]; then
                  cd /tmp/worker-repo/ys-admin/cf-worker
                  npm install wrangler 2>/dev/null
                  npx wrangler deploy 2>&1 || echo "⚠️ deploy also failed"
                else
                  echo "❌ Cannot perform runtime reset via wrangler"
                fi
              }
              
              echo "✅ Rollback/Deploy completed - Worker runtime has been reset"
              sleep 5
            else
              echo "⚠️ Skipping rollback (no API token or version unknown)"
              echo "   KV state has been cleared, which should resolve most issues"
            fi
          fi
          
          if [ "$TRIGGER_AFTER_RESET" = "true" ]; then
            echo "--- Step 3: Triggering Collection ---"
            sleep 3
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              https://ys-admin.ftsqm.xyz/api/diagnose/trigger-cron \
              -H "User-Agent: GitHub-Actions-Cron" \
              || echo -e "\n000")
            
            HttpResponseCode=$(echo "$RESPONSE" | tail -n1)
            ResponseBody=$(echo "$RESPONSE" | sed '$d')
            
            echo "Trigger HTTP: $HttpResponseCode"
            echo "Trigger Response: $ResponseBody"
            
            SKIPPED=$(echo "$ResponseBody" | grep -o '"skipped":[^,}]*' | cut -d':' -f2)
            if [ "$SKIPPED" = "true" ]; then
              echo "✅ Worker decided to skip (collection recovered or task running)"
              exit 0
            fi
            
            if [ "$HttpResponseCode" = "200" ]; then
              echo "✅ Full recovery cycle completed (reset → rollback → trigger)"
              exit 0
            else
              echo "❌ Trigger failed after recovery"
              exit 1
            fi
          fi
